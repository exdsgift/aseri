# fields of the example hubs' model-metadata-schema.json.
team_name: aseri
team_abbr: aseri
model_name: Timestral-209M, zero-shot
model_abbr: timestral209m
model_version: "weights mistralai/Timestral-209M at 9874d252ab0aae16f7f7c999f98f98d6ad7d8365, package timestral at a534bdbd244d64f3d9d743f46c7bf6fc330ed4ff"
model_contributors:
  - name: exdsgift
    affiliation: aseri
website_url: https://exdsgift.github.io/aseri/
repo_url: https://github.com/exdsgift/aseri
# The hubs' licence lists hold no CC BY-NC 4.0, so "other", and methods_long states it.
license: other
designated_model: true
data_inputs: >-
  Each series' own daily history only, from: the Caldara and Iacoviello daily Geopolitical Risk index;
  Wikimedia pageviews of the English Wikipedia article World War III; the EIA Europe Brent spot price
  through FRED; IMF PortWatch daily transits of the Suez Canal, the Strait of Hormuz, Bab el-Mandeb and
  the Taiwan Strait; the Ukrainian air raid sirens dataset; the drones Ukraine's General Staff claims
  downed. No covariates.
methods: >-
  Timestral-209M (Mistral AI), zero-shot and univariate, on each series' full daily history, on CPU:
  21 quantile levels, sorted, counts clipped at 0.
methods_long: >-
  Each day, for every series whose data moved to a new last observed day (the reference date), the
  pretrained Timestral-209M forecasts the next 7, 14 or 28 steps from the series' whole history up to
  that day, one series at a time, with no covariates and no fine-tuning. A step is a calendar day, or a
  trading day for Brent. The model gives 21 quantile levels, 0.01 to 0.99; aseri sorts them and clips
  counts at 0 and air-raid hours at 0 to 600, and publishes them to four decimals. Uncertainty is only
  the model's own quantiles: no calibration layer, and no correlation between series. Known measurement
  errors are left blank in the model's input. A forecast is issued once per series and reference date
  and never changed; those issued after the fact, such as the 120-day launch backfill, are labelled
  retrospective and kept out of the live record. Timestral's training-data cutoff is not published, so
  backtests may be optimistic. Licence of the model output: CC BY-NC 4.0
  (https://creativecommons.org/licenses/by-nc/4.0/), attributed as "Forecasts: aseri (model
  aseri-timestral209m, Timestral-209M by Mistral AI)"; upstream terms still apply to the underlying
  data, per series (https://exdsgift.github.io/aseri/api/v1/series.json).
ensemble_of_models: false
ensemble_of_hub_models: false
