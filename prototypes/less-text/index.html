// ---------- the switches, kept in the hash (the one part of a link an artifact keeps), in
// the order of AXES, the first option the default: #A-line-play-squares, then optionally a
// replay day of GPR's: #A-none-still-squares-2026-10-19.
const AXES = {
  stats: { name: "Stats wording", options: { A: "A: likely", B: "B: 20 blocks", C: "C: 80% range" } },
  label: { name: "Path label", options: { none: "none", line: "on the line" } },
  first: { name: "First view", options: { still: "path 1", play: "play 20 once" } },
  verdict: { name: "Replay verdict", options: { none: "none", squares: "squares" } },
}
function readHash() {
  const parts = decodeURIComponent(location.hash.slice(1)).split("-")
  const at = parts.slice(4).join("-")
  return {
    V: Object.fromEntries(Object.entries(AXES).map(([axis, { options }], i) => [axis, parts[i] in options ? parts[i] : Object.keys(options)[0]])),
    at: /^\d{4}-\d{2}-\d{2}$/.test(at) ? at : null,
  }
}
const V = readHash().V

// ---------- series, as web/src/lib/api.ts builds them
function build(s) {
  const time = s.dates.map((d) => Date.parse(d))

  const averages = s.values.map((_, end) => {
    const from = Math.max(0, end - 6)
    return mean(s.values.slice(from, end + 1).filter((_, k) => time[from + k] > time[end] - 7 * DAY))
  })
  const byDate = new Map(s.dates.map((d, i) => [d, s.values[i]]))
  const newest = s.dates.at(-1)
  const made = (ref, q, mode, live) => {
    const origin = s.dates.indexOf(ref)
    const targetDates = Array.from({ length: s.horizon }, (_, k) => addDays(ref, k + 1))
    return {
      series: s.title, ref, quantiles: q, targetDates, live, backtest: mode === "retrospective",
      dates: s.dates.slice(first, origin + 1), values: s.values.slice(first, origin + 1), averages: averages.slice(first, origin + 1),
      actuals: live ? [] : targetDates.filter((d) => d <= newest).map((d) => byDate.get(d) ?? null),
    }

    made(s.latest.ref, s.latest.q, s.latest.mode, true),

}

// ---------- pixel drawing (as web/src/lib/chart.ts on ticket-150-blue-rotation, with solid marks only)
const BAYER = [0, 8, 2, 10, 12, 4, 14, 6, 3, 11, 1, 9, 15, 7, 13, 5]
function valueScale(fitted, top, bottom) {

function square(plot, x, y, size, c) { for (let dx = 0; dx < size; dx++) for (let dy = 0; dy < size; dy++) plot(x + dx, y + dy, c) }

// The real values white and 2 art px heavy, the model's path gold and 1 art px, the bands dim

function paintChart(plot, c, f, path, o) {

  const end = actuals.findLastIndex((v) => v !== null)

  polyline(mark, averages.slice(first).map((v, i) => [x(first + i), y(v)]), C.dim)
  polyline(mark, values.slice(first).map((v, i) => [x(first + i), y(v)]), C.white, 2)

// The 20 values a quantile dotplot shows: one at each level 0.025, 0.075 ... 0.975.
const twenty = (q, levels, day) => Array.from({ length: 20 }, (_, i) => quantileAt(q, levels, day, 0.025 + 0.05 * i))

  for (let pitch = 5; pitch <= 12 && best.max < 4; pitch++) {

// Direct labels: each takes the first candidate spot that stays in bounds and clear of the
// labels before it, crossing as few line points as it can. Sizes follow Press Start 2P's 8 px grid.
function placeLabels(items, bounds, points) {
  const placed = []
  return items.map((it) => {
    const lines = it.text.split("\n")

    for (const cd of it.cands) {

      const r = { l, t: Math.round(cd.y), r: l + w, b: Math.round(cd.y) + h }
      const b = it.bounds ?? bounds
      let score = (cd.cost ?? 0) + (r.l < b.l || r.r > b.r || r.t < b.t || r.b > b.b ? 1e4 : 0)
      for (const p of placed) if (r.l < p.r && r.r > p.l && r.t < p.b && r.b > p.t) score += 1e3
      for (const [px, py] of points) if (px >= r.l && px <= r.r && py >= r.t && py <= r.b) score += 1
      if (score < bestScore) { bestScore = score; best = r }

    ${at(fmt(q["0.1"][e]), lowX, bottom + 2)}${at(fmt(q["0.9"][e]), x(q["0.9"][e]) * P + 1, bottom + 2)}
    <i style="position:absolute;left:${bx}px;top:${bottom}px;width:2px;height:16px;background:var(--sec)"></i>
    <span class="lbl" style="left:${Math.max(0, Math.min(Wpx - 80, bx - 1))}px;top:${bottom + 18}px">normal ${fmt(GPR.baseline)}</span>`
  cv.style.position = "absolute"; cv.style.top = "14px"; cv.style.left = "0"
  el.prepend(cv)
}

// ---------- forecast panel
const S = { id: "gpr_daily", shown: null, drawn: 0, playing: false, timer: 0, intro: false, introDone: false }
const series = () => SERIES[S.id]
const shownIndex = () => S.shown ?? series().forecasts.length - 1
const forecast = () => series().forecasts[shownIndex()]

function stopMotion() { clearInterval(S.timer); S.timer = 0; S.playing = false; S.intro = false }
function openForecast(id, ref) {
  stopMotion()
  S.id = id; S.drawn = 0
  const i = ref ? series().forecasts.findIndex((f) => f.ref === ref) : -1
  S.shown = i < 0 ? null : i
  setupSlider(); updatePanel(); markPicked()
}

function updatePanel() {
  const s = series(), f = forecast(), e = f.targetDates.length - 1, q = f.quantiles, live = f.live
  const range = W.range(head(q["0.1"][e]), head(q["0.9"][e]))
  $("p-title").textContent = live
    ? `${cap(range)} by ${md(f.targetDates[e])}, ${direction(chanceAbove(q, e, f.values.at(-1)))}`
    : `${f.backtest ? "Backtest" : "Forecast"} made ${md(f.ref)}: ${range} by ${md(f.targetDates[e])}`
  const unit = s.id === "gpr_daily" ? "index, daily" : "ships a day"
  $("p-sub").textContent = `${s.title} ${unit}${live ? "" : ` · what happened as of ${md(s.asOf)}`}`
  drawPanelChart()
  drawVerdict()
  $("p-play").hidden = reduced
  $("p-play").textContent = S.playing ? "Pause" : "Play"
  $("p-which").textContent = `Path ${S.drawn + 1} of ${PATHS}${S.drawn ? "" : ", the most likely"}`
  const i = shownIndex(), last = s.forecasts.length - 1
  $("p-range").value = i
  const label = $("p-handle")
  label.textContent = live ? "Today" : md(f.ref)
  const pos = `calc(10px + (100% - 20px) * ${i / last})`
  label.style.left = pos
  label.style.translate = i > last / 2 ? "calc(-100% - 12px)" : "12px"
  for (const t of $("p-ticks").children) t.classList.toggle("on", Number(t.dataset.i) <= i)
  $("p-to").style.visibility = live ? "hidden" : "visible"
  $("p-back").style.visibility = live ? "hidden" : "visible"
  fillDetails()
}

function setupSlider() {
  const fs = series().forecasts, last = fs.length - 1
  $("p-range").max = last
  $("p-from").textContent = md(fs[0].ref)
  $("p-ticks").innerHTML = Array.from({ length: Math.floor(last / 7) + 1 }, (_, w) => last - 7 * w)
    .map((i) => `<i class="tick" data-i="${i}" style="left:calc(10px + (100% - 20px) * ${i / last})"></i>`).join("")
}

function drawPanelChart() {
  const box = $("p-chart"), s = series(), f = forecast()
  const width = Math.floor(box.getBoundingClientRect().width)
  if (!width) return
  const c = chartLayout(f, width, s.baseline)
  const path = ranked(f, s.rho)[S.drawn].values
  const cv = canvasOf(c.art, (plot) => paintChart(plot, c, f, path, { baseline: s.baseline, ticks: true, stack: V.stats === "B" }))
  cv.setAttribute("role", "img")
  const e = c.ahead - 1, q = f.quantiles
  cv.setAttribute("aria-label", `${s.title}: daily values to ${md(f.ref)}, then ${W.range(fmt(q["0.1"][e]), fmt(q["0.9"][e]))} by ${md(f.targetDates[e])}. The yellow line is path ${S.drawn + 1} of ${PATHS}.`)
  const { left, right, top, bottom, x, y, first, origin, narrow } = c
  const X = (d) => x(d) * P
  const fixed = []
  // Value ticks, the first and last dates, and the one date anchor on the origin line.
  for (const t of valueTicks(c.lo, c.hi)) fixed.push(`<span class="lbl" style="right:${width - (left - 4) * P}px;top:${y(t) * P - 6}px">${fmt(t)}</span>`)
  const fromDate = md(f.dates[first]), toDate = md(f.targetDates[e])
  if (X(origin) - left * P > 56) fixed.push(`<span class="lbl" style="left:${left * P}px;top:${(bottom + 3) * P}px">${fromDate}</span>`)
  fixed.push(`<span class="lbl" style="right:${width - (right + 1) * P}px;top:${(bottom + 3) * P}px">${toDate}</span>`)
  const anchor = `data to ${md(f.ref)}`
  fixed.push(`<span class="lbl" style="left:${Math.max(0, X(origin) - anchor.length * 8 - 3)}px;top:2px">${anchor}</span>`)
  if (V.stats !== "B") {
    const real = f.actuals[e] ?? undefined
    const ends = [{ v: q["0.9"][e], cls: "" }, { v: q["0.1"][e], cls: "" }, ...(real === undefined ? [] : [{ v: real, cls: "white" }])].toSorted((a, b) => b.v - a.v)
    let prev = -Infinity
    for (const { v, cls } of ends) { const t = Math.max(y(v) * P - 6, prev + 14); prev = t; fixed.push(`<span class="lbl ${cls}" style="left:${(right + 4) * P}px;top:${t}px">${fmt(v)}</span>`) }
  }
  // Line points the direct labels should not cover.
  const along = (pts) => pts.flatMap(([x1, y1], i) => {
    if (!i) return [[x1, y1]]
    const [x0, y0] = pts[i - 1], n = Math.max(1, Math.ceil(Math.hypot(x1 - x0, y1 - y0) / 3))
    return Array.from({ length: n }, (_, j) => [x0 + ((x1 - x0) * (j + 1)) / n, y0 + ((y1 - y0) * (j + 1)) / n])
  })
  const points = [
    ...along(path.map((v, k) => [X(origin + k), y(v) * P])),
    ...along(f.values.slice(first).map((v, i) => [X(first + i), y(v) * P])),
    ...along(f.averages.slice(first).map((v, i) => [X(first + i), y(v) * P])),
    ...along(f.actuals.flatMap((v, k) => (v === null ? [] : [[X(origin + 1 + k), y(v) * P]]))),
    ...(s.baseline > c.lo && s.baseline < c.hi ? along([[left * P, y(s.baseline) * P], [(right + 1) * P, y(s.baseline) * P]]) : []),
  ]
  const bounds = { l: left * P, r: (right + 1) * P, t: top * P, b: bottom * P }
  const zone = { l: X(origin) + 3, r: (right + 1) * P, t: top * P, b: bottom * P }
  const yTop = y(q["0.9"][e]) * P, yBot = y(q["0.1"][e]) * P, xR = right * P - 2
  const items = []
  const bandText = W.band(narrow), bh = bandText.split("\n").length * 12
  items.push({ text: bandText, bounds: zone, cands: [0.5, 0.3, 0.7, 0.15, 0.85].map((fr) => ({ x: xR, y: yTop + (yBot - yTop) * fr - bh / 2, align: "right" })) })
  const out = W.outside(narrow)
  if (out) { const oh = out.split("\n").length * 12; items.push({ text: out, cls: "out", extra: 10, bounds: zone, cands: [{ x: xR, y: yTop - oh - 3, align: "right" }, { x: xR, y: yBot + 4, align: "right" }] }) }
  if (V.label === "line") {
    const t = narrow ? `${S.drawn + 1} of ${PATHS}\npossible paths` : `${S.drawn + 1} of ${PATHS} possible paths`, th = t.split("\n").length * 12
    const cands = []
    for (const k of [2, 4, 6, 8, 11, 14].filter((k) => k < path.length)) {
      const px = X(origin + k) - 2, py = y(path[k]) * P
      cands.push({ x: px, y: py - th - 4, align: "left" }, { x: px, y: py + 5, align: "left" })
    }
    items.push({ text: t, cls: "white", bounds: zone, cands })
  }
  const end = f.actuals.findLastIndex((v) => v !== null)
  if (end >= 0) {
    const ex = X(origin + 1 + end), ey = y(f.actuals[end]) * P
    items.push({ text: narrow ? "what\nhappened" : "what happened", cls: "white", bounds: zone, cands: [-30, 6, -54, 30].flatMap((dy) => [{ x: ex - 4, y: ey + dy, align: "right" }, { x: ex + 6, y: ey + dy, align: "left" }]) })
  }
  const hist = { l: left * P + 2, r: X(origin) - 3, t: top * P, b: bottom * P }
  if (s.baseline > c.lo && s.baseline < c.hi) {
    const yb = y(s.baseline) * P
    items.push({ text: `normal ${fmt(s.baseline)}`, bounds: hist, cands: [{ x: left * P + 2, y: yb - 14 }, { x: left * P + 2, y: yb + 4 }, { x: X(origin) - 4, y: yb - 14, align: "right" }, { x: X(origin) - 4, y: yb + 4, align: "right" }] })
  }
  // Beside its own line, as near as the other marks allow.
  const lineCands = (vals) => [0.02, 0.2, 0.4, 0.6].flatMap((fr) => {
    const d = first + Math.round(fr * (origin - first)), px = X(d), py = y(vals[d]) * P
    return [0, 12, 24, 36].flatMap((k) => [{ x: px, y: py - 15 - k, align: "left", cost: k / 12 }, { x: px, y: py + 4 + k, align: "left", cost: k / 12 }])
  })
  items.push({ text: "daily", cls: "white", bounds: hist, cands: lineCands(f.values) })
  items.push({ text: "7-day avg", bounds: hist, cands: lineCands(f.averages) })
  const placed = placeLabels(items, bounds, points)
  // Variant B: the key to the blocks, under them, its square as big as theirs.
  if (V.stats === "B") {
    const { pitch } = dotplot(twenty(q, levelsOf(q), e).map((v) => y(v) - top), c.art.width - right - 4)
    fixed.push(`<span class="lbl" style="right:0;top:${c.art.height * P + 4}px"><span class="sq" style="background:var(--sec);width:${(pitch - 1) * P}px;height:${(pitch - 1) * P}px"></span> = 1 in 20 chance</span>`)
  }
  box.style.height = `${c.art.height * P + (V.stats === "B" ? 22 : 0)}px`
  box.innerHTML = fixed.join("") + placed.map(labelHtml).join("") + `<div class="tip" hidden></div>`
  box.prepend(cv)
  // A hover or tap shows one day in numbers: layer two, so it is not in the word count.
  const tip = box.querySelector(".tip")
  const show = (ev) => {
    const d = c.dayAt((ev.clientX - cv.getBoundingClientRect().left) / P), k = d - origin - 1
    const lines = k < 0
      ? [md(f.dates[d]), `daily ${fmt(f.values[d])}`, `7-day avg ${fmt(f.averages[d])}`]
      : [md(f.targetDates[k]), W.range(fmt(q["0.1"][k]), fmt(q["0.9"][k])), `middle estimate ${fmt(q["0.5"][k])}`,
         ...(f.actuals[k] != null ? [`what happened ${fmt(f.actuals[k])}`] : [])]
    tip.textContent = lines.join("\n")
    tip.hidden = false
    const px = X(d)
    if (px < width / 2) { tip.style.left = `${px + 12}px`; tip.style.right = "" } else { tip.style.right = `${width - px + 12}px`; tip.style.left = "" }
  }
  cv.onpointermove = show
  cv.onpointerdown = show
  cv.onpointerleave = (ev) => { if (ev.pointerType !== "touch") tip.hidden = true }
}

// Replay verdict: a filled or hollow square under each resolved day, then the count.
function drawVerdict() {
  const el = $("p-verdict"), f = forecast(), s = series()
  if (V.verdict !== "squares" || f.live || !f.actuals.some((v) => v !== null)) { el.innerHTML = ""; el.hidden = true; return }
  el.hidden = false
  const q = f.quantiles
  const marks = f.actuals.map((v, k) => (v === null ? null : v >= q["0.1"][k] && v <= q["0.9"][k]))
  const known = marks.filter((m) => m !== null), inside = known.filter(Boolean).length
  const width = Math.floor($("p-chart").getBoundingClientRect().width)
  const c = chartLayout(f, width, s.baseline)
  const pitch = ((c.right - c.left) / c.span) * P
  const sq = (m) => `<i class="v ${m === null ? "gap" : m ? "" : "o"}"></i>`
  // Aligned under each day where the days are 8 px apart or more; on a phone, a strip in day order.
  const aligned = pitch >= 8
  const start = c.x(c.origin + 1) * P - 2
  const row = aligned
    ? `<div class="row">${marks.map((m, k) => sq(m).replace("<i ", `<i style="left:${c.x(c.origin + 1 + k) * P - 2}px" `)).join("")}</div>`
    : `<div class="row wrap" style="margin-left:${Math.max(0, Math.min(start, width - 16 * 8))}px">${marks.map(sq).join("")}</div>`
  el.innerHTML = `${row}<p style="margin-left:${aligned ? Math.max(0, start) : Math.max(0, Math.min(start, width - 16 * 8))}px">${inside} of ${known.length} days in range</p>`
}

function fillDetails() {
  const s = series(), f = forecast(), q = f.quantiles, e = f.targetDates.length - 1, target = md(f.targetDates[e])
  const band = {
    A: `<p>The shaded range is where 8 in 10 days should land; 2 in 10 land outside. It is not a high and a low.</p>`,
    B: `<p>Each block at the right is 1 in 20 chances for ${target}. 16 of the 20 sit beside the shaded range, 2 above it and 2 below. The range is not a high and a low.</p>`,
    C: `<p>The shaded range is where 80% of days should land; 20% land outside. It is not a high and a low.</p>`,
  }[V.stats]
  $("p-read").innerHTML = `${band}
    <p>The yellow line is one of ${PATHS} possible paths drawn from the forecast, the most likely first. Play shows the others, one at a time. No one knows which days turn out high.</p>
    ${s.weekly ? `<p>Values follow the week: compare a ${wd(f.ref)} with a ${wd(f.ref)}.</p>` : ""}
    <p>Normal: ${esc(s.baselineLabel)}, ${fmt(s.baseline)}. In a replay, the white line carries on with what happened.</p>`
  const rows = s.steps.map((step) => {
    const k = step - 1, real = f.actuals[k] ?? undefined
    const inside = real !== undefined && real >= q["0.1"][k] && real <= q["0.9"][k]
    return `<p><b>${md(f.targetDates[k])} (${step} days)</b>: ${W.range(fmt(q["0.1"][k]), fmt(q["0.9"][k]))} · ${W.middle(fmt(q["0.25"][k]), fmt(q["0.75"][k]))} · middle estimate ${fmt(q["0.5"][k])}${real === undefined ? "" : ` · what happened ${fmt(real)}, ${inside ? "in range" : "outside"}`}</p>`
  })
  $("p-numbers").innerHTML = `<p><b>${md(f.ref)}</b>, last data: ${fmt(f.values.at(-1))}</p>${rows.join("")}
    <p>1-year range of the daily value to ${md(s.latest.ref)}: ${fmt(s.year[0])}-${fmt(s.year[1])}</p>`
  $("p-sources").innerHTML = `<p style="overflow-wrap:anywhere">${esc(s.attribution)}</p>
    <p>Data as of ${md(s.asOf)}${s.id === "gpr_daily" ? ", preliminary for about 4 weeks" : ""}.</p>
    ${f.backtest ? `<p>Backtest: made after the fact, with only the data up to ${md(f.ref)}, but as published later. The model's training cutoff is not published, so backtests may be optimistic.</p>` : ""}`
}

// Play cycles the paths, one every 1.2 s; the intro (variant "play 20 once") shows each once,
// a little faster, and stops on path 1. Neither runs under reduced motion.
function togglePlay() {
  if (S.playing || S.intro) { stopMotion(); updatePanel(); return }
  S.playing = true
  S.timer = setInterval(() => { S.drawn = (S.drawn + 1) % PATHS; updatePanel() }, 1200)
  updatePanel()
}
function startIntro() {
  if (reduced || S.playing || S.intro || S.introDone || !forecast().live) return
  S.intro = true; S.introDone = true
  let k = 0
  S.timer = setInterval(() => {
    k++
    S.drawn = k % PATHS
    if (k === PATHS) { clearInterval(S.timer); S.timer = 0; S.intro = false }
    updatePanel()
  }, 400)
}
const seen = new IntersectionObserver(([entry]) => {
  if (entry.isIntersecting && V.first === "play") startIntro()
}, { threshold: 0.6 })

$("p-play").onclick = togglePlay
$("p-next").onclick = () => { stopMotion(); S.drawn = (S.drawn + 1) % PATHS; updatePanel() }
$("p-range").oninput = (ev) => { stopMotion(); S.drawn = 0; const i = ev.target.valueAsNumber; S.shown = i === series().forecasts.length - 1 ? null : i; updatePanel() }
$("p-back").onclick = () => { stopMotion(); S.drawn = 0; S.shown = null; updatePanel(); $("p-range").focus() }

// ---------- signals
function renderSignals() {
  const byGap = LANES.map((s) => ({ s, v: versus(s.forecasts.at(-1).averages.at(-1), s.baseline) })).toSorted((a, b) => Math.abs(b.v.p) - Math.abs(a.v.p))
  const [topLane, ...rest] = byGap
  const within = Math.ceil(Math.max(...rest.map((r) => Math.abs(r.v.p))) / 5) * 5
  const title = Math.abs(topLane.v.p) >= 25
    ? `${topLane.s.short} traffic ${topLane.v.text}; other lanes within ${within}%`
    : `All lanes within ${Math.ceil(Math.abs(topLane.v.p) / 5) * 5}% of normal`
  $("signals").innerHTML = `
    <div class="sect-head"><h2 id="s-title" class="display">Signals</h2><p class="t12 white">${esc(title)}</p>
      <p class="sec">All values: 7-day averages to ${md(LANES[0].latest.ref)}. Tap a card to open its forecast.</p></div>
    <div class="cards">${LANES.map(card).join("")}</div>`
  for (const btn of document.querySelectorAll(".card")) btn.onclick = () => { openForecast(btn.dataset.id); $("panel").scrollIntoView({ behavior: reduced ? "auto" : "smooth" }) }
  drawMinis(); markPicked()
}
function card(s) {
  const f = s.forecasts.at(-1), e = f.targetDates.length - 1, q = f.quantiles, avg = f.averages.at(-1), v = versus(avg, s.baseline)
  const tri = v.p < 0 ? "M0 0h5v1H0zM1 1h3v1H1zM2 2h1v1H2z" : "M2 0h1v1H2zM1 1h3v1H1zM0 2h5v1H0z"
  return `<button type="button" class="card frame chip" data-id="${s.id}" aria-pressed="false">
    <span class="sec">${esc(s.title)}</span>
    <span><b class="t16 white" style="font-weight:normal">${fmt(avg)}</b> <span class="sec">ships a day</span></span>
    <span><svg class="tri" viewBox="0 0 5 3" shape-rendering="crispEdges" aria-hidden="true"><path d="${tri}"/></svg>${v.text}</span>
    <span class="mini" data-mini="${s.id}"></span>
    <span class="white">${md(f.targetDates[e])}: ${W.range(head(q["0.1"][e]), head(q["0.9"][e]))} a day</span>
  </button>`
}
function drawMinis() {
  for (const el of document.querySelectorAll("[data-mini]")) {
    const s = SERIES[el.dataset.mini], f = s.forecasts.at(-1), width = Math.floor(el.getBoundingClientRect().width)
    if (!width) continue
    const c = miniLayout(f, width, s.baseline)
    el.replaceChildren(canvasOf(c.art, (plot) => paintChart(plot, c, f, ranked(f, s.rho)[0].values, { baseline: s.baseline, ticks: false, stack: false })))
  }
}
function markPicked() { for (const b of document.querySelectorAll(".card")) b.setAttribute("aria-pressed", String(b.dataset.id === S.id)) }

// ---------- record
const BASE = { mean28: "a simple 4-week average", naive: "just repeating the last value", snaive7: "the same weekday a week back" }
function skill(ae, base) {
  if (!ae || ae.verdict == null) return "Not enough to compare yet"
  if (ae.verdict === "beats") return `${Math.round((1 - ae.ratio) * 100)}% smaller misses than ${base}`
  if (ae.verdict === "loses") return `${Math.round((ae.ratio - 1) * 100)}% bigger misses than ${base}`
  return `About as good as ${base}`
}
function renderRecord() {
  const all = [GPR, ...LANES]
  const scoredOf = (s) => (s.score.n >= s.score.min ? s.score.live : s.score.retro)
  const weekly = all.flatMap((s) => scoredOf(s).weekly)
  const hits = weekly.filter((w) => w.inside_80).length, n = weekly.length, rate = hits / n, sd = Math.sqrt(0.16 / n)
  const close = Math.abs(rate - 0.8) <= 2 * sd ? "close to" : rate < 0.8 ? "fewer than" : "more than"
  const live = Math.min(...all.map((s) => s.score.n)), needed = all[0].score.min
  const backtest = all.every((s) => s.score.n < s.score.min)
  const ten = (r) => `<span class="tenbar" aria-hidden="true">${Array.from({ length: 10 }, (_, i) => `${i === 8 ? "<b></b>" : ""}<i class="${i < Math.round(r * 10) ? "f" : ""}"></i>`).join("")}</span>`
  $("record").innerHTML = `
    <div class="sect-head"><h2 id="r-title" class="display">Record</h2>
      <p class="t12 white">${backtest ? "Backtest: " : ""}${hits} of ${n} forecasts landed in range, ${close} ${W.promised()}</p></div>
    ${backtest ? `<p class="banner">Live record starts after ${needed} forecasts (${live} so far). Until then, backtests made after the fact.</p>` : ""}
    <div class="key"><span><span class="sq"></span> landed in range</span><span><span class="sq o"></span> missed</span><span>${W.hollow()}</span></div>
    <ul class="rec">${all.map((s) => {
      const w = scoredOf(s).weekly, k = w.filter((x) => x.inside_80).length
      const first = s.forecasts[0].ref
      return `<li class="frame chip"><span class="sec">${esc(s.title)}</span>
        <span class="squares">${w.map((x) => {
          const said = `${md(x.reference_date)}: ${x.inside_80 ? "landed in range" : "missed"} 7 days ahead`
          return x.reference_date >= first
            ? `<button type="button" class="${x.inside_80 ? "" : "o"}" data-s="${s.id}" data-r="${x.reference_date}" aria-label="${said}. Open it in the replay"></button>`
            : `<span class="s ${x.inside_80 ? "" : "o"}" role="img" aria-label="${said}"></span>`
        }).join("")}<span style="margin-left:6px">${k} of ${w.length} in range</span></span></li>`
    }).join("")}</ul>
    <div class="more"><details><summary>How we score</summary><div class="layer2">
      ${all.map((s) => `<p><b>${esc(s.title)}</b></p>${Object.entries(scoredOf(s).buckets).map(([name, b]) => {
        const [lo, hi] = name.split("-").map(Number)
        return b.cov === undefined ? "" : `<p>Days ${lo}-${Math.min(hi, s.horizon)}: ${ten(b.cov)}${Math.round(b.cov * 100)}% landed in range · aim 80%. ${skill(b.ae, BASE[s.score.primary])}.</p>`
      }).join("")}`).join("")}
      <p>Each square is one weekly forecast, scored 7 days ahead. Misses: how far the middle estimate fell from what happened, on average. Better or worse only when the whole 95% interval of the comparison says so; about as good otherwise.</p>
      <p>Backtests are made after the fact, with data published later, so they may flatter the model.</p>
    </div></details></div>`
  for (const b of document.querySelectorAll(".squares button")) b.onclick = () => { openForecast(b.dataset.s, b.dataset.r); $("panel").scrollIntoView({ behavior: reduced ? "auto" : "smooth" }) }
}

// ---------- the prototype bar: the current choice and the default view's word count
const words = (text) => text.split(/\s+/).filter((w) => /[\p{L}\p{N}]/u.test(w)).length
let barOpen = false, counts = {}
function countWords() {
  counts = { Hero: $("hero"), Panel: $("panel"), Signals: $("signals"), Record: $("record"), Footer: $("foot") }
  for (const k in counts) counts[k] = words(counts[k].innerText)
  counts.total = Object.values(counts).reduce((a, b) => a + b, 0)
  document.documentElement.dataset.words = counts.total
  document.documentElement.dataset.split = JSON.stringify(counts)
}
function renderBar() {
  const bar = $("proto")
  const choice = Object.entries(AXES).map(([axis, a]) => a.options[V[axis]]).join(" · ")
  bar.classList.toggle("open", barOpen)
  bar.innerHTML = `<button type="button" class="sum" aria-expanded="${barOpen}"><span>${esc(choice)}<br><small>${barOpen ? "Tap to close" : "Prototype: tap to switch variants"}</small></span><span class="count">${counts.total} words</span></button>
    <div class="grid">${Object.entries(AXES).map(([axis, a]) => `<span class="k">${a.name}</span><span class="seg">${Object.entries(a.options).map(([key, label]) =>
      `<button type="button" data-axis="${axis}" data-key="${key}" aria-pressed="${V[axis] === key}">${esc(label)}</button>`).join("")}</span>`).join("")}
      <span class="split">Default view, words by block: hero ${counts.Hero} · panel ${counts.Panel} · signals ${counts.Signals} · record ${counts.Record} · footer ${counts.Footer}. Today's page: about 906.</span></div>`
  bar.querySelector(".sum").onclick = () => { barOpen = !barOpen; renderBar() }
  for (const b of bar.querySelectorAll("[data-axis]")) b.onclick = () => {
    V[b.dataset.axis] = b.dataset.key
    try { history.replaceState(null, "", `#${Object.values(V).join("-")}`) } catch {}
    renderAll()
  }
}

// A switch shows its variant's default view: today's GPR forecast on path 1, every layer two closed.
function renderAll() {
  stopMotion()
  Object.assign(S, { id: "gpr_daily", shown: null, drawn: 0, introDone: false })
  for (const d of document.querySelectorAll("details")) d.open = false
  renderHero()
  setupSlider(); updatePanel()
  renderSignals()
  renderRecord()
  $("foot").textContent = "Engraving: Hendrick Goltzius, Mercury, 1592, CC0"
  countWords()
  renderBar()
  seen.unobserve($("p-chart")); seen.observe($("p-chart"))
}

let resizing = 0
addEventListener("resize", () => { cancelAnimationFrame(resizing); resizing = requestAnimationFrame(() => { drawHeroBar(); drawPanelChart(); drawVerdict(); drawMinis() }) })
// A day in the hash opens GPR's forecast of that day in the replay, after the default view is counted.
function fromHash() {
  const { V: picked, at } = readHash()
  Object.assign(V, picked)
  renderAll()
  if (at) openForecast("gpr_daily", at)
}
addEventListener("hashchange", fromHash)
fromHash()
// The fonts change no word, but they arrive after the first layout: draw the labels again.
document.fonts?.ready.then(() => { drawHeroBar(); drawPanelChart(); drawVerdict(); drawMinis() })
</script>
