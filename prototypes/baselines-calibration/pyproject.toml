# The research environment of #146, apart from the pipeline's lockfile: the heavy ensemble members live only here.
[project]
name = "aseri-baselines-calibration"
version = "0"
requires-python = "==3.12.*"
dependencies = [
    # As in pipeline/pyproject.toml, so `aseri` imports and Timestral is the production model.
    "numpy>=2.5.4",
    "pandas>=3.1.0",
    "timestral",
    "torch>=2.15.0",
    # The ensemble members, both Apache-2.0 code and weights. timesfm 2.0.2 is the last release whose
    # default model is TimesFM-2.5; the 3.0 weights are non-commercial and never loaded.
    "chronos-forecasting==2.3.2",
    "timesfm[torch]==2.0.2",
    # AutoETS: statsforecast pins pandas below 3, which `aseri` needs, so the ETS is statsmodels'.
    "statsmodels==0.15.0",
    "scipy>=1.15",
]

[tool.uv]
package = false

[tool.uv.sources]
torch = { index = "pytorch-cpu" }
timestral = { git = "https://github.com/mistralai/timestral.git", rev = "a534bdbd244d64f3d9d743f46c7bf6fc330ed4ff" }

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true
