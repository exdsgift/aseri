name: daily

on:
  schedule:
    - cron: "0 7 * * *"
  workflow_dispatch:

permissions:
  contents: read

# One run at a time: a queued run waits rather than cancelling a deploy halfway.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  # Runs the tests, the model and third-party code, so it gets no deploy rights.
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: pipeline
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          working-directory: pipeline
      - run: uv sync --locked
      - name: Test, so a broken pipeline never publishes
        run: uv run pytest
      - uses: actions/setup-node@v7
        with:
          node-version-file: web/.node-version
          cache: npm
          cache-dependency-path: web/package-lock.json
      # Before the forecast, so a broken page fails fast and never publishes.
      - name: Test and build the page into site/
        working-directory: web
        run: npm ci && npm run typecheck && npm test && npm run build
      - name: Read the pinned weights revision from the code
        id: weights
        run: echo "revision=$(grep -oP 'WEIGHTS_REVISION = "\K[0-9a-f]+' aseri/forecast.py)" >> "$GITHUB_OUTPUT"
      - name: Cache the Timestral weights (837 MB) by their pinned revision
        uses: actions/cache@v6
        with:
          path: ~/.cache/huggingface/hub
          key: timestral-209m-${{ steps.weights.outputs.revision }}
      - name: Fetch, forecast and publish
        run: uv run python -m aseri ../site/api/v1
      - uses: actions/upload-pages-artifact@v5
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v5
