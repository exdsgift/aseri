name: daily

on:
  schedule:
    - cron: "0 7 * * *"
  workflow_dispatch:
    inputs:
      accept_revisions:
        description: "Accept an upstream rewrite older than the revision window, after reviewing it (this run only)"
        type: boolean
        default: false

permissions:
  contents: read

# One run at a time: a queued run waits rather than cancelling a deploy halfway, and archive pushes never race.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  # Runs the tests, the model and third-party code, so it gets no write rights.
  build:
    runs-on: ubuntu-latest
    outputs:
      archive_exists: ${{ steps.archive.outputs.exists }}
      archive_adds: ${{ steps.adds.outputs.any }}
      revision_hold: ${{ steps.run.outputs.revision_hold }}
    defaults:
      run:
        working-directory: pipeline
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          working-directory: pipeline
      - run: uv sync --locked
      - name: Test, so a broken pipeline never publishes
        run: uv run pytest
      - uses: actions/setup-node@v7
        with:
          node-version-file: web/.node-version
          cache: npm
          cache-dependency-path: web/package-lock.json
      # Before the forecast, so a broken page fails fast and never publishes.
      - name: Test and build the page into site/
        working-directory: web
        run: npm ci && npm run typecheck && npm test && npm run build
      - name: Read the pinned weights revision from the code
        id: weights
        run: echo "revision=$(grep -oP 'WEIGHTS_REVISION = "\K[0-9a-f]+' aseri/forecast.py)" >> "$GITHUB_OUTPUT"
      - name: Cache the Timestral weights (837 MB) by their pinned revision
        uses: actions/cache@v6
        with:
          path: ~/.cache/huggingface/hub
          key: timestral-209m-${{ steps.weights.outputs.revision }}
      # Before anything is archived: a dependency or model change that moves the numbers stops here, under its old MODEL_ID.
      - name: Check the model still gives its golden quantiles
        run: uv run pytest -m slow -k golden_quantiles -rs
      - name: Find the archive branch, or start from an empty archive
        id: archive
        run: |
          status=0
          git ls-remote --exit-code --heads origin archive > /dev/null || status=$?
          # 2 means no archive branch yet; any other failure must not pass for an empty archive.
          case $status in
            0) echo "exists=true" >> "$GITHUB_OUTPUT" ;;
            2) echo "exists=false" >> "$GITHUB_OUTPUT"; git init -q ../archive ;;
            *) exit "$status" ;;
          esac
      - name: Check out the archive, shallow
        if: steps.archive.outputs.exists == 'true'
        uses: actions/checkout@v7
        with:
          ref: archive
          path: archive
      - name: Fetch, forecast, archive and publish
        id: run
        env:
          # Empty on the cron, "true" only on a manual run with the box ticked.
          ASERI_ACCEPT_REVISIONS: ${{ inputs.accept_revisions }}
        run: |
          # Exit 3 is a revision hold (aseri/__main__.py): flagged here, by a step that succeeds, and failed in the next.
          status=0
          uv run python -m aseri ../site/api/v1 ../archive || status=$?
          if [ "$status" -eq 3 ]; then echo "revision_hold=true" >> "$GITHUB_OUTPUT"; else exit "$status"; fi
      - name: Hold publication after a rewrite older than the revision window
        if: steps.run.outputs.revision_hold == 'true'
        run: |
          # Failing the build skips archive and deploy, so the last good site stays up.
          echo "::error::Upstream rewrote data older than its revision window: nothing is archived or deployed. See the step above."
          exit 1
      - name: Collect the files this run adds to the archive
        id: adds
        working-directory: archive
        run: |
          mkdir "$RUNNER_TEMP/archive-adds"
          git ls-files --others -z | xargs -0r cp --parents -t "$RUNNER_TEMP/archive-adds"
          if [ -n "$(ls -A "$RUNNER_TEMP/archive-adds")" ]; then echo "any=true" >> "$GITHUB_OUTPUT"; fi
      - if: steps.adds.outputs.any == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: archive-adds
          path: ${{ runner.temp }}/archive-adds
          if-no-files-found: error
      - uses: actions/upload-pages-artifact@v5
        with:
          path: site

  # Holds the write rights, so it runs only git and shell: no Python packages, no model.
  archive:
    needs: build
    # Only master's runs are permanent: a manual run on another branch builds but never archives.
    if: github.ref == 'refs/heads/master' && needs.build.outputs.archive_adds == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          # On the very first run there is no archive branch: check out the default one and orphan it below.
          ref: ${{ needs.build.outputs.archive_exists == 'true' && 'archive' || '' }}
      - name: Start the orphan archive branch on the very first run
        if: needs.build.outputs.archive_exists != 'true'
        run: git switch --orphan archive
      - uses: actions/download-artifact@v8
        with:
          name: archive-adds
          path: ${{ runner.temp }}/archive-adds
      - name: Add the new files, if they are all rounds, deltas or manifests
        run: |
          # The build job runs third-party code, so a file that is not one of these (a git hook, say) stops the run.
          files=$(cd "$RUNNER_TEMP/archive-adds" && find . ! -type d -printf '%y %p\n')
          if printf '%s\n' "$files" | grep -vE '^f \./(model-output/[a-z0-9-]+/[0-9]{4}-[0-9]{2}-[0-9]{2}-[a-z0-9-]+\.csv|target-data/deltas/[0-9]{4}-[0-9]{2}-[0-9]{2}\.csv|runs/[0-9]{4}-[0-9]{2}-[0-9]{2}\.json)$'; then
            echo "::error::The build's archive files include something that is not a round, a delta or a manifest"
            exit 1
          fi
          cp -r "$RUNNER_TEMP/archive-adds/." .
          git add -A
      - name: Refuse any change to an archived file
        run: |
          # Append-only: --diff-filter=a lists every staged change that is not a new file.
          changed=$(git diff --cached --name-status --diff-filter=a)
          if [ -n "$changed" ]; then
            echo "::error::The archive is append-only, and this run would change: $changed"
            exit 1
          fi
      - name: Refuse an archive over 50 MB
        run: |
          git count-objects -vH
          # The shallow checkout holds the whole tip, which is the whole archive since no file is ever deleted.
          # On the very first run it also counts the default branch, a few MB: an overestimate, never an underestimate.
          kib=$(git count-objects -v | awk '$1 == "size:" || $1 == "size-pack:" { total += $2 } END { print total }')
          if [ "$kib" -gt $((50 * 1024)) ]; then
            echo "::error::The archive branch is ${kib} KiB, over its 50 MB budget"
            exit 1
          fi
      - name: Commit and push
        run: |
          git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
            commit -q -m "Archive $(git diff --cached --name-only -- runs)"
          git push origin archive

  # Opens an issue on a revision hold. It runs only gh, no third-party code, so it alone gets issues: write.
  revision-alert:
    needs: build
    # Like archive and deploy, only master's runs count: a test run on a branch opens no issue.
    if: failure() && github.ref == 'refs/heads/master' && needs.build.outputs.revision_hold == 'true'
    runs-on: ubuntu-latest
    permissions:
      issues: write
    steps:
      - name: Open an issue, unless one is open already
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          title="Revision hold: upstream rewrote data older than its revision window"
          # Every daily run fails the same way until someone acts, so one open issue is enough.
          if [ "$(gh issue list --state open --search "\"$title\" in:title" --json number --jq length)" -gt 0 ]; then
            echo "An issue is open already"
            exit 0
          fi
          gh issue create --title "$title" --body "The daily run stopped before archiving or deploying anything: upstream changed values older than the series' revision window. The site keeps its last good forecasts.

          Run: $RUN_URL

          The step \"Fetch, forecast, archive and publish\" names the series and the oldest changed day. Review the change upstream. If it is genuine, run the daily workflow by hand with accept_revisions ticked: that run records the rewrite, and the daily runs go on from it. If the file is broken, wait for upstream to fix it."

  deploy:
    needs: [build, archive]
    # Also on a day with nothing new to archive, when archive is skipped; never after a failure, never off master.
    if: ${{ github.ref == 'refs/heads/master' && !cancelled() && !failure() }}
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v5
